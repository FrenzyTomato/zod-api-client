openapi: 3.0.3
info:
  title: Books
  version: 1.0.0
paths:
  /books:
    get:
      tags: [books]
      operationId: listBooks
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  required: [title]
                  properties:
                    title:
                      type: string
